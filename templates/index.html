<!DOCTYPE html>
<html>
<head>
<title>EvidLens - Market Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F7FA]">

<!-- HEADER -->
<header class="text-white px-6 py-4 sticky top-0 shadow-md z-40" style="background:#0A1F44">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="/" class="font-bold text-2xl"><span>Evid</span><span style="color:#14B8A6">Lens</span></a>

    <!-- PROFILE DROPDOWN -->
    <div class="relative" id="profileMenu">
      <button id="profileBtn" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-gradient-to-r from-[#14B8A6] to-[#0A1F44] flex items-center justify-center text-white font-bold">
          {{ current_user.full_name[:1] }}
        </div>
      </button>

      <div id="profileDropdown" class="absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-xl hidden text-[#0A1F44] z-50">
        <div class="p-4 border-b border-gray-100">
          <p class="font-bold">{{ current_user.full_name }}</p>
          <p class="text-xs text-gray-500">{{ current_user.email }}</p>
          <span class="text-xs px-2 py-0.5 rounded-full bg-teal-100 text-teal-700 mt-1 inline-block">
            {{ current_user.plan }}
          </span>
        </div>
        <div class="p-2 max-h-96 overflow-y-auto">
          <a href="/settings" class="block px-3 py-2 hover:bg-gray-50 rounded-lg text-sm">Profile & Preferences</a>
          <a href="/billing" class="block px-3 py-2 hover:bg-gray-50 rounded-lg text-sm">Billing & Subscriptions</a>
          <a href="/history" class="block px-3 py-2 hover:bg-gray-50 rounded-lg text-sm">Activity & History</a>
          <a href="/stats" class="block px-3 py-2 hover:bg-gray-50 rounded-lg text-sm">Usage & Stats</a>
          <a href="/wallet" class="block px-3 py-2 hover:bg-gray-50 rounded-lg text-sm">
            Wallet / Credits: {{ current_user.credits }}
          </a>
          <a href="/security" class="block px-3 py-2 hover:bg-gray-50 rounded-lg text-sm">Security & 2FA</a>
        </div>
        <div class="p-2 border-t border-gray-100">
          <button onclick="logout()" class="w-full text-left px-3 py-2 hover:bg-red-50 text-red-600 rounded-lg text-sm">Sign Out</button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- YOUR DASHBOARD CONTENT GOES HERE -->
<div class="max-w-7xl mx-auto p-6">
  <h1 class="text-3xl font-bold text-[#0A1F44]">Welcome back, {{ current_user.full_name.split(' ')[0] }}</h1>
  <!-- Paste your analysis form and dashboard cards here from main.py -->
</div>

<script>
// dropdown toggle
document.getElementById('profileBtn').onclick = () => {
  document.getElementById('profileDropdown').classList.toggle('hidden')
}
function logout(){ window.location.href = '/logout' }
</script>

</body>
</html>
