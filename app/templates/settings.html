<!DOCTYPE html>
<html>
<head>
<title>Settings - EvidLens</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#F5F7FA; font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.card{background:white; border-radius:16px; padding:24px; box-shadow:0 1px 4px rgba(16,24,40,0.06)}
</style>
</head>
<body class="bg-[#F5F7FA]">
  <!-- Header -->
  <header class="bg-[#0A1F44] text-white px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center gap-3">
      <a href="/" class="font-bold text-2xl"><span>Evid</span><span style="color:#14B8A6">Lens</span></a>
    </div>
  </header>

  <div class="max-w-4xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-[#0A1F44] mb-6">Settings</h1>

    <!-- Profile Card -->
    <div class="card mb-6">
      <h2 class="text-xl font-bold text-[#0A1F44] mb-4">Profile & Preferences</h2>
      <form id="profileForm" class="space-y-4">
        <div>
          <label class="text-sm font-semibold text-gray-700">Full Name</label>
          <input name="full_name" value="{{ current_user.full_name }}" class="w-full p-3 border rounded-lg mt-1 focus:border-[#14B8A6] outline-none">
        </div>
        <div>
          <label class="text-sm font-semibold text-gray-700">Email</label>
          <input name="email" value="{{ current_user.email }}" readonly class="w-full p-3 border rounded-lg mt-1 bg-gray-100">
        </div>
        <div>
          <label class="text-sm font-semibold text-gray-700">Plan</label>
          <div class="flex items-center gap-2 mt-1">
            <span class="px-3 py-1 rounded-full bg-teal-100 text-teal-700 font-bold">{{ current_user.plan }}</span>
            <a href="/billing" class="text-[#14B8A6] text-sm font-bold">Upgrade</a>
          </div>
        </div>
        <button class="bg-[#14B8A6] text-white px-6 py-3 rounded-lg font-bold">Save Changes</button>
        <p id="profileMsg" class="text-sm"></p>
      </form>
    </div>

    <!-- Password Card -->
    <div class="card mb-6">
      <h2 class="text-xl font-bold text-[#0A1F44] mb-4">Change Password</h2>
      <form id="passwordForm" class="space-y-4">
        <input name="old_password" type="password" placeholder="Current Password" class="w-full p-3 border rounded-lg">
        <input name="new_password" type="password" placeholder="New Password" class="w-full p-3 border rounded-lg">
        <button class="bg-[#0A1F44] text-white px-6 py-3 rounded-lg font-bold">Update Password</button>
        <p id="passMsg" class="text-sm"></p>
      </form>
    </div>

    <!-- Credits Card -->
    <div class="card">
      <h2 class="text-xl font-bold text-[#0A1F44] mb-4">Wallet & Credits</h2>
      <p class="text-3xl font-bold">{{ current_user.credits }} <span class="text-base font-normal text-gray-500">Credits</span></p>
      <a href="/wallet" class="text-[#14B8A6] font-bold mt-2 inline-block">Buy More Credits →</a>
    </div>

  </div>

<script>
// Save profile
document.getElementById('profileForm').onsubmit=async e=>{
  e.preventDefault();
  const res=await fetch('/settings/profile',{method:'POST',body:new FormData(e.target)});
  const data=await res.json();
  document.getElementById('profileMsg').innerText=data.message;
  document.getElementById('profileMsg').className='text-sm text-green-600';
}

// Change password
document.getElementById('passwordForm').onsubmit=async e=>{
  e.preventDefault();
  const res=await fetch('/settings/password',{method:'POST',body:new FormData(e.target)});
  const data=await res.json();
  document.getElementById('passMsg').innerText=data.message;
  document.getElementById('passMsg').className=res.ok ? 'text-sm text-green-600' : 'text-sm text-red-600';
}
</script>
</body></html>
