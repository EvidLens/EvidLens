<script>
let billing = 'monthly';
let PRICING = {}; // will be loaded from backend
let plansMeta = [];

function formatKES(n){ 
  if(n === -1) return 'Unlimited';
  return 'KES ' + n.toLocaleString() 
}

async function loadPricing() {
  try {
    const res = await fetch('/pricing'); // hits your core/service.py
    const data = await res.json();
    
    PRICING = data.plans; // EV-SME, EV-GROWTH etc
    
    // Map backend to UI cards
    plansMeta = [
      {
        key: "EV-SME", 
        name: "SME", 
        features: [
          `${PRICING["EV-SME"].areas} Area`, 
          `${PRICING["EV-SME"].products} Products`, 
          `${PRICING["EV-SME"].users} User`, 
          `${PRICING["EV-SME"].competitors} Competitors`,
          "Basic Lens"
        ]
      },
      {
        key: "EV-GROWTH", 
        name: "GROWTH", 
        features: [
          `${PRICING["EV-GROWTH"].areas} Areas`, 
          `${PRICING["EV-GROWTH"].products} Products`, 
          `${PRICING["EV-GROWTH"].users} Users`, 
          `${PRICING["EV-GROWTH"].competitors} Competitors`,
          `${PRICING["EV-GROWTH"].leads_qtr} Leads/Qtr`
        ]
      },
      {
        key: "EV-PRO", 
        name: "PRO", 
        features: [
          `${PRICING["EV-PRO"].areas} Areas`, 
          `${PRICING["EV-PRO"].products} Products`, 
          "Unlimited Users", 
          "Unlimited Competitors",
          `${PRICING["EV-PRO"].leads_qtr} Leads/Qtr`
        ]
      }
    ];
    
    renderPlans();
    renderAddons(data.addons);
    renderALC(data.ala_carte);
    
  } catch(e) {
    console.error("Failed to load pricing", e)
  }
}

function renderPlans(){
  const grid = document.getElementById('plans-grid');
  grid.innerHTML = '';
  plansMeta.forEach(p=>{
    const planData = PRICING[p.key];
    if(!planData) return;
    
    const price = billing === 'monthly' ? planData.monthly : planData.annual;
    const sub = billing === 'monthly'? '/month' : '/year';
    const isPopular = p.key === "EV-GROWTH";
    
    grid.innerHTML += `
    <div class="bg-white p-6 rounded-2xl shadow ${isPopular? 'border-4 border-[#14B8A6]' : 'border border-gray-200'}">
      ${isPopular? '<p class="text-xs bg-[#14B8A6] text-white px-2 py-1 rounded-full inline-block mb-2">MOST POPULAR</p>' : ''}
      <h3 class="font-bold text-lg" style="color:#0A1F44">${p.name}</h3>
      <p class="text-3xl font-bold mt-2" style="color:#0A1F44">${formatKES(price)}<span class="text-sm font-normal text-gray-500">${sub}</span></p>
      <ul class="text-sm mt-4 space-y-2 text-gray-700">
        ${p.features.map(f=>`<li>✓ ${f}</li>`).join('')}
      </ul>
      <button onclick="checkout('${p.key}')" class="mt-4 w-full bg-[#14B8A6] hover:bg-[#0D9488] text-white py-3 rounded-lg font-semibold">
        Get Started
      </button>
    </div>`
  })
}

function renderAddons(addonsData){
  const grid = document.getElementById('addons-grid');
  grid.innerHTML = '';
  Object.entries(addonsData).forEach(([key, a])=>{
    const price = billing === 'monthly' ? a.annual/12 : a.annual;
    const priceText = formatKES(Math.round(price));
    grid.innerHTML += `
    <div class="bg-white p-4 rounded-lg border flex justify-between items-center">
      <div><p class="font-semibold">${key}</p><p class="text-sm text-gray-600">${priceText}</p></div>
      <button onclick="checkoutAddon('${key}')" class="bg-[#14B8A6] text-white px-3 py-1 rounded text-sm">Add</button>
    </div>`
  })
}

function renderALC(alcData){
  const grid = document.getElementById('alc-grid');
  grid.innerHTML = '';
  Object.entries(alcData).forEach(([key, a])=>{
    grid.innerHTML += `
    <div class="bg-white p-4 rounded-lg border flex justify-between items-center">
      <div><p class="font-semibold">${key}</p><p class="text-sm text-gray-600">${formatKES(a.price)}</p></div>
      <button onclick="contactSales('${key}')" class="bg-[#F59E0B] text-white px-3 py-1 rounded text-sm">Contact</button>
    </div>`
  })
}

function toggleBilling(){
  billing = billing === 'monthly'? 'yearly' : 'monthly';
  document.getElementById('toggleCircle').style.left = billing === 'yearly'? '2.25rem' : '0.25rem';
  document.getElementById('monthlyLabel').style.color = billing === 'monthly'? '#0A1F44' : '#9CA3AF';
  document.getElementById('yearlyLabel').style.color = billing === 'yearly'? '#0A1F44' : '#9CA3AF';
  renderPlans();
}

async function checkout(plan){
  const phone = prompt("Enter M-PESA phone: 2547XXXXXXXX");
  if(!phone) return;
  const btn = event.target;
  btn.innerText = "Processing...";
  btn.disabled = true;
  
  // CRITICAL: send plan_code like EV-GROWTH
  const res = await fetch('/api/checkout', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({plan_code: plan, billing, phone})
  })
  const data = await res.json();
  btn.innerText = "Get Started";
  btn.disabled = false;
  alert(data.ResponseDescription || data.message || JSON.stringify(data))
}

async function checkoutAddon(key){
  const phone = prompt("Enter M-PESA phone for " + key + ": 2547XXXXXXXX");
  if(!phone) return;
  const res = await fetch('/api/checkout-addon', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({addon_key: key, phone})
  })
  const data = await res.json();
  alert(data.ResponseDescription || data.message || JSON.stringify(data))
}

function contactSales(key){
  window.location.href = "/contact?service=" + key;
}

// Load from backend on page load
loadPricing();
</script>
