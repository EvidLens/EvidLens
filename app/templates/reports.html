{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-[#0A1F44]">📊 My Reports</h1>
      <p class="text-gray-500">Generate, download and share your intelligence reports</p>
    </div>
    <button onclick="openGenerateModal()" class="bg-[#0A1F44] text-white px-6 py-2 rounded-lg font-bold hover:opacity-90">
      + Generate New Report
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <p class="text-xs text-gray-500 uppercase">Total Reports</p>
      <p class="text-2xl font-bold" id="totalReports">0</p>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <p class="text-xs text-gray-500 uppercase">This Month</p>
      <p class="text-2xl font-bold text-[#14B8A6]" id="monthReports">0</p>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <p class="text-xs text-gray-500 uppercase">Funding Matches</p>
      <p class="text-2xl font-bold text-yellow-600"><a href="/reports/funding" class="underline">View Radar →</a></p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
        <tr>
          <th class="p-4 text-left">Title</th>
          <th class="p-4 text-left">Type</th>
          <th class="p-4 text-left">Date</th>
          <th class="p-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="reportsTable">
        <tr><td colspan="4" class="p-8 text-center text-gray-500">Loading reports...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Generate Modal -->
<div id="genModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
 <div class="bg-white p-6 rounded-xl w-full max-w-md">
  <h3 class="font-bold text-lg mb-4">Generate Market Report</h3>
  <input id="mQuery" placeholder="What to analyze? e.g. maize prices Kirinyaga" class="w-full border p-2 rounded mb-3"/>
  <input id="mSector" placeholder="Sector e.g. Agriculture" value="Agriculture" class="w-full border p-2 rounded mb-3"/>
  <input id="mCounty" placeholder="County e.g. Kirinyaga" value="Kirinyaga" class="w-full border p-2 rounded mb-3"/>
  <div class="flex gap-2 justify-end">
   <button onclick="closeGen()" class="px-4 py-2">Cancel</button>
   <button onclick="submitGenerate()" class="bg-[#0A1F44] text-white px-6 py-2 rounded font-bold">Generate</button>
  </div>
 </div>
</div>

<script>
function openGenerateModal(){ document.getElementById('genModal').classList.remove('hidden'); }
function closeGen(){ document.getElementById('genModal').classList.add('hidden'); }

async function loadReports(){
  try{
    const res = await fetch('/reports/list');
    const data = await res.json();
    const list = data.reports || data;
    const tbody = document.getElementById('reportsTable');
    document.getElementById('totalReports').innerText = list.length || 0;
    document.getElementById('monthReports').innerText = list.length || 0;
    if(!list.length){
      tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500">No reports yet. Click Generate New Report.</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(r => `
      <tr class="border-t hover:bg-gray-50">
        <td class="p-4 font-bold text-[#0A1F44]">${r.title || r.type || 'Report'}</td>
        <td class="p-4"><span class="bg-teal-100 text-teal-700 px-2 py-1 rounded text-xs">${r.type || r.report_type || 'General'}</span> <span class="text-xs text-gray-500">${r.status || ''}</span></td>
        <td class="p-4 text-gray-500">${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</td>
        <td class="p-4 text-right flex justify-end gap-2">
          ${r.status==='READY' ? `<a href="/reports/download/${r.id}" class="bg-[#0A1F44] text-white px-3 py-1 rounded text-xs">Download PDF</a>` : `<span class="text-xs text-yellow-600">${r.status}</span>`}
          <button onclick="deleteReport(${r.id})" class="bg-red-50 text-red-600 px-3 py-1 rounded text-xs">Delete</button>
        </td>
      </tr>
    `).join('');
  } catch(e){
    document.getElementById('reportsTable').innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-500">Failed to load: '+e+'</td></tr>';
  }
}
async function submitGenerate(){
  const query = document.getElementById('mQuery').value || 'maize market analysis';
  const sector = document.getElementById('mSector').value || 'Agriculture';
  const county = document.getElementById('mCounty').value || 'Kirinyaga';
  closeGen();
  const res = await fetch('/reports/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      query: query,
      sector: sector,
      county: county,
      country: "Kenya",
      report_type: "MARKET_FEASIBILITY",
      format: "PDF"
    })
  });
  const txt = await res.text();
  if(res.ok){ alert('Generating! Check list in 30s'); loadReports(); } else { alert('Failed: '+txt); }
}
async function deleteReport(id){
  if(!confirm('Delete report?')) return;
  await fetch('/reports/'+id, {method: 'DELETE'});
  loadReports();
}
loadReports();
setInterval(loadReports, 10000);
</script>
{% endblock %}
