{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-[#0A1F44]">📊 My Reports</h1>
      <p class="text-gray-500">Generate, download and share your intelligence reports</p>
    </div>
    <button onclick="generateReport()" class="bg-[#0A1F44] text-white px-6 py-2 rounded-lg font-bold hover:opacity-90">
      + Generate New Report
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <p class="text-xs text-gray-500 uppercase">Total Reports</p>
      <p class="text-2xl font-bold" id="totalReports">0</p>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <p class="text-xs text-gray-500 uppercase">This Month</p>
      <p class="text-2xl font-bold text-[#14B8A6]" id="monthReports">0</p>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <p class="text-xs text-gray-500 uppercase">Funding Matches</p>
      <p class="text-2xl font-bold text-yellow-600"><a href="/reports/funding" class="underline">View Radar →</a></p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
        <tr>
          <th class="p-4 text-left">Title</th>
          <th class="p-4 text-left">Type</th>
          <th class="p-4 text-left">Date</th>
          <th class="p-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="reportsTable">
        <tr><td colspan="4" class="p-8 text-center text-gray-500">Loading reports...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
async function loadReports(){
  try{
    const res = await fetch('/reports/list');
    const data = await res.json();
    const tbody = document.getElementById('reportsTable');
    document.getElementById('totalReports').innerText = data.length || 0;
    document.getElementById('monthReports').innerText = data.length || 0;
    if(!data.length){
      tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-500">No reports yet. Click Generate New Report.</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(r => `
      <tr class="border-t hover:bg-gray-50">
        <td class="p-4 font-bold text-[#0A1F44]">${r.title || r.report_type || 'Report'}</td>
        <td class="p-4"><span class="bg-teal-100 text-teal-700 px-2 py-1 rounded text-xs">${r.report_type || 'General'}</span></td>
        <td class="p-4 text-gray-500">${new Date(r.created_at).toLocaleDateString()}</td>
        <td class="p-4 text-right flex justify-end gap-2">
          <a href="/reports/download/${r.id}" class="bg-[#0A1F44] text-white px-3 py-1 rounded text-xs">Download PDF</a>
          <button onclick="deleteReport(${r.id})" class="bg-red-50 text-red-600 px-3 py-1 rounded text-xs">Delete</button>
        </td>
      </tr>
    `).join('');
  } catch(e){
    document.getElementById('reportsTable').innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-500">Failed to load: '+e+'</td></tr>';
  }
}
async function generateReport(){
  const title = prompt('Report title?', 'Market Intelligence Report - '+new Date().toLocaleDateString());
  if(!title) return;
  const res = await fetch('/reports/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: title, report_type: 'market'})
  });
  if(res.ok){ alert('Report generated!'); loadReports(); } else { alert('Failed: '+(await res.text())); }
}
async function deleteReport(id){
  if(!confirm('Delete report?')) return;
  await fetch('/reports/'+id, {method: 'DELETE'});
  loadReports();
}
loadReports();
</script>
{% endblock %}
