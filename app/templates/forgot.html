<!DOCTYPE html><html><head>
<title>Forgot Password - EvidLens</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F7FA] flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-[#0A1F44]">Forgot Password?</h1>
    <p class="text-gray-500 text-sm">Enter your email and we'll send a reset link</p>
  </div>

  <form id="forgotForm" class="space-y-4">
    <input name="email" type="email" required class="w-full p-3 border rounded-lg focus:border-[#14B8A6] outline-none" placeholder="you@example.com">
    <button class="bg-[#14B8A6] text-white w-full p-3 rounded-lg font-bold hover:bg-[#0e9a8c]">Send Reset Link</button>
  </form>
  <p id="msg" class="mt-4 text-center text-sm"></p>
  <p class="text-center text-sm mt-4"><a href="/login" class="text-[#14B8A6] font-semibold">Back to Login</a></p>
</div>

<script>
document.getElementById('forgotForm').onsubmit=async e=>{
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.innerText = "Sending...";
  btn.disabled = true;
  const res = await fetch('/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});
  const data = await res.json();
  document.getElementById('msg').innerText = data.message;
  document.getElementById('msg').className = "mt-4 text-center text-sm text-green-600";
  btn.innerText = "Send Reset Link";
  btn.disabled = false;
}
</script>
</body></html>
