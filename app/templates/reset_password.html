<form method="POST" action="/auth/reset-password">
  <input type="hidden" name="token" value="{{ token }}">
  <input name="password" type="password" placeholder="New Password" required class="w-full p-3 border rounded-lg mb-3">
  <button class="bg-[#14B8A6] text-white w-full p-3 rounded-lg">Reset Password</button>
</form>
