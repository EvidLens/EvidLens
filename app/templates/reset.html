<!DOCTYPE html>
<html>
<head>
<title>Reset Password - EvidLens</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F5F7FA] flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl w-96 shadow-lg">
    <a href="/" class="font-bold text-2xl block text-center mb-4"><span style="color:#0A1F44">Evid</span><span style="color:#14B8A6">Lens</span></a>
    <h1 class="text-2xl font-bold mb-2 text-[#0A1F44] text-center">Reset Password</h1>
    <p class="text-gray-500 text-sm text-center mb-6">Enter your new password below</p>
    
    <form id="resetForm">
      <input type="hidden" name="token" value="{{ token }}">
      <input name="new_password" type="password" required minlength="8" class="w-full p-3 border rounded-lg mb-3 focus:border-[#14B8A6] outline-none" placeholder="New Password - min 8 chars">
      <button class="bg-[#14B8A6] text-white w-full p-3 rounded-lg font-bold hover:opacity-90">Reset Password</button>
    </form>
    <p id="msg" class="mt-3 text-sm text-center"></p>
    <p class="text-center mt-4 text-sm"><a href="/login" class="text-[#14B8A6]">Back to Login</a></p>
  </div>

<script>
document.getElementById('resetForm').onsubmit=async e=>{
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerText = "Resetting...";
  msg.className = "mt-3 text-sm text-center text-gray-500";
  
  const res = await fetch('/auth/reset-password',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.fromEntries(new FormData(e.target)))
  });
  const data = await res.json();
  
  if(res.ok){
    msg.innerText = data.message;
    msg.className = "mt-3 text-sm text-center text-green-600";
    setTimeout(()=>window.location.href='/login', 2000);
  } else {
    msg.innerText = data.detail || "Error resetting password";
    msg.className = "mt-3 text-sm text-center text-red-600";
  }
}
</script>
</body></html>
