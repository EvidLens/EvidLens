<div id="lens-widget" class="fixed bottom-6 right-6 z-50">
    <button id="lens-toggle" class="bg-[#0A1F44] text-white p-4 rounded-full shadow-2xl hover:bg-[#14B8A6] transition">
        <span class="font-bold">Lens</span>
    </button>
    <div id="lens-chat" class="hidden w-[380px] h-[600px] bg-white rounded-xl shadow-2xl flex flex-col border">
        <div class="p-4 bg-[#0A1F44] text-white rounded-t-xl font-bold flex justify-between items-center">
            <div>✨ Lens AI</div><span class="text-xs bg-[#14B8A6] px-2 py-1 rounded-full">Online</span>
        </div>
        <div id="lens-messages" class="flex-1 p-4 overflow-y-auto text-sm space-y-3"></div>
        <div id="lens-typing" class="hidden px-4 text-xs text-gray-500">Lens is thinking...</div>
        <form id="lens-form" class="p-3 border-t flex gap-2">
            <input id="lens-input" type="text" placeholder="" class="flex-1 border rounded-lg px-3 py-2 text-sm outline-none focus:border-[#14B8A6]">
            <button class="bg-[#14B8A6] text-white px-4 rounded-lg font-bold">Send</button>
        </form>
    </div>
</div>
<script>
const toggle = document.getElementById('lens-toggle');
const chat = document.getElementById('lens-chat');
const form = document.getElementById('lens-form');
const messages = document.getElementById('lens-messages');
const typing = document.getElementById('lens-typing');

toggle.onclick = () => chat.classList.toggle('hidden');

function addMessage(text, sender) {
    const bubble = sender === 'user'? 'bg-[#14B8A6] text-white ml-auto' : 'bg-gray-100 text-[#0A1F44] mr-auto';
    const safeText = (text || 'How can I help with Kenya markets?').replace(/\n/g,'<br>');
    messages.innerHTML += `<div class="flex"><div class="${bubble} p-3 rounded-2xl max-w-[80%] whitespace-pre-wrap">${safeText}</div></div>`;
    messages.scrollTop = messages.scrollHeight;
}

form.onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('lens-input');
    const msg = input.value.trim();
    if(!msg) return;
    addMessage(msg, 'user');
    input.value = '';
    typing.classList.remove('hidden');
    try {
        const token = localStorage.getItem('token') || localStorage.getItem('access_token') || '';
        const headers = {'Content-Type': 'application/json'};
        if(token) headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({message: msg, history: [], context: {}})
        });
        const data = await res.json();
        typing.classList.add('hidden');
        const reply = data.reply || data.response || data.answer || data.message || JSON.stringify(data);
        addMessage(reply, 'ai');
    } catch(err) {
        typing.classList.add('hidden');
        addMessage('Lens offline - retry. ' + err.message, 'ai');
    }
}
</script>
